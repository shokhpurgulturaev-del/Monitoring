<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#14274a;--mut:#6b7385;--line:#d9dde6;--acc:#14274a;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2d;--ink:#e8ecf4;--mut:#9aa3b5;--line:#2a3347;--acc:#7aa2ff;--bad:#ff8a80}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:20px}p{margin:0;color:var(--mut);font-size:14px}
input[type=password]{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mut)}
button{font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0f1420}}
#err{color:var(--bad);font-size:14px;min-height:1em}
</style>
</head>
<body>
<form id="f" hidden>
  <h1>Мониторинг плана</h1>
  <p>Введите пароль доступа.</p>
  <input id="pw" type="password" autocomplete="current-password" required>
  <label><input id="rm" type="checkbox" checked> Запомнить на этом устройстве</label>
  <button type="submit">Открыть</button>
  <div id="err"></div>
</form>
