<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#14274a;--mut:#6b7385;--line:#d9dde6;--acc:#14274a;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2d;--ink:#e8ecf4;--mut:#9aa3b5;--line:#2a3347;--acc:#7aa2ff;--bad:#ff8a80}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:20px}p{margin:0;color:var(--mut);font-size:14px}
input[type=password]{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mut)}
button{font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0f1420}}
#err{color:var(--bad);font-size:14px;min-height:1em}
</style>
</head>
<body>
<form id="f" hidden>
  <h1>Мониторинг плана</h1>
  <p>Введите пароль доступа.</p>
  <input id="pw" type="password" autocomplete="current-password" required>
  <label><input id="rm" type="checkbox" checked> Запомнить на этом устройстве</label>
  <button type="submit">Открыть</button>
  <div id="err"></div>
</form>

  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},key,u(P.c)));
}
const HEAD='<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png?v=2"><link rel="apple-touch-icon" href="icon-180.png?v=2"><meta name="theme-color" content="#14274a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dashboard"><meta name="robots" content="noindex,nofollow">';
// автообновление (26.10.2026): при возврате в приложение, фокусе и раз в 5 минут проверяем, не вышла ли новая версия на сайте; если да — перезагружаем страницу (пароль запомнен)
function chk(V){var busy=0;function go(){if(busy||document.visibilityState!=='visible')return;busy=1;
  fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(t){
    var m=t.match(/"v": "([^"]+)"/); if(m&&m[1]!==V){location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));}
  }).catch(function(){}).then(function(){busy=0;});}
  document.addEventListener('visibilitychange',go);window.addEventListener('pageshow',go);window.addEventListener('focus',go);setInterval(go,300000);setTimeout(go,1500);}
function show(h){h=h.replace('<head>','<head>'+HEAD+'<script>('+chk.toString()+')('+JSON.stringify(P.v||'')+')<\/script>'); document.open();document.write(h);document.close();}
const f=document.getElementById('f'), err=document.getElementById('err');
f.addEventListener('submit',async e=>{e.preventDefault(); err.textContent='Проверка…';
  const pw=document.getElementById('pw').value;
  try{const h=await dec(pw); if(document.getElementById('rm').checked){try{localStorage.setItem(K,pw);}catch(_){}} show(h);}
  catch(_){err.textContent='Неверный пароль';}});
(async()=>{let pw=null; try{pw=localStorage.getItem(K);}catch(_){}
  if(pw){try{show(await dec(pw));return;}catch(_){try{localStorage.removeItem(K);}catch(__){}}}
  f.hidden=false; document.getElementById('pw').focus();})();
